<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Panel - Shree Balaji Oil Agency</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root{--green:#03A64A;--red:#F21D44}
body{margin:0;font-family:Arial;background:#f4f6f8}
header{background:var(--green);color:#fff;padding:14px;text-align:center;font-size:20px;font-weight:bold}
.container{padding:14px}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:0 2px 6px rgba(0,0,0,.1)}
input,textarea,button,select{width:100%;padding:10px;margin-top:8px;border-radius:6px;border:1px solid #ccc}
button{border:none;background:var(--green);color:#fff;font-size:15px;cursor:pointer}
button.red{background:var(--red)}
button.gray{background:#777}
.product{border-bottom:1px solid #eee;padding:8px 0}
.small{font-size:13px;color:#666}
.scroll{max-height:260px;overflow-y:auto}
.actions button{width:auto;margin-right:6px;margin-top:6px;font-size:13px}
</style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>

<body>

<header>Admin Panel – Shree Balaji Oil Agency</header>

<div class="container">

<div class="card" id="loginBox">
  <h3>Admin Login</h3>
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<div id="dashboard" style="display:none">

  <div class="card">
    <h3>Add Category</h3>
    <input id="catName" placeholder="Category Name">
    <button onclick="addCategory()">Add Category</button>
  </div>

  <div class="card">
    <h3>Add / Edit Product</h3>

    <input type="hidden" id="pid">

    <select id="pcategory"></select>
    <input id="pname" placeholder="Product Name">
    <input id="pprice" placeholder="Price">
    <input id="pmrp" placeholder="MRP">
    <input id="pmobile" placeholder="Mobile Number">
    <textarea id="pdesc" placeholder="Product Description"></textarea>
    <input type="file" id="images" multiple>

    <button onclick="addProduct()">Save Product</button>
  </div>

  <div class="card">
  <h3>Products</h3>

  <select id="productCategoryFilter" onchange="filterProducts()">
    <option value="ALL">All Categories</option>
  </select>

  <button onclick="downloadCategoryPDF()">
    Download Category PDF
  </button>

  <div id="productCount" class="small" style="margin-top:8px;">
    Total Products: 0
  </div>

  <div id="productList" class="scroll"></div>
</div>

  <div class="card">
    <button onclick="location.href='user.html'">View Users</button>
    <button onclick="location.href='admin-order.html'">View Orders</button>
    <button onclick="location.href='status-admin.html'">Status Panel</button>
  </div>

  <button class="red" onclick="logout()">Logout</button>

</div>
</div>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyCt99elKr4T1OJihGpQ6t2luYmCmEBJeo0",
  authDomain: "balajimere-c8eb9.firebaseapp.com",
  projectId: "balajimere-c8eb9"
});

const auth = firebase.auth();
const db = firebase.firestore();
const IMGBB_KEY = "5e77bfe737324a6c147697a13fefcb3d";

/* LOGIN */
function login(){
 auth.signInWithEmailAndPassword(email.value,password.value);
}
function logout(){auth.signOut();}

auth.onAuthStateChanged(u=>{
 if(u && u.email==="balajimere.admin@gmail.com"){
  loginBox.style.display="none";
  dashboard.style.display="block";
  loadProducts();
  loadCategories();
 }else{
  dashboard.style.display="none";
  loginBox.style.display="block";
 }
});

/* CATEGORY */
async function addCategory(){
 let c = catName.value.trim();
 if(!c) return;
 await db.collection("categories").doc(c).set({name:c});
 catName.value="";
}
function loadCategories(){
 db.collection("categories").onSnapshot(s=>{
  pcategory.innerHTML="";
  s.forEach(d=>{
   pcategory.innerHTML+=`<option value="${d.id}">${d.id}</option>`;
  });
 });
}

/* IMAGE UPLOAD + ADD / EDIT PRODUCT */
async function addProduct(){

 let imageInput = document.getElementById("images");

 // Existing images from current product
 let oldImages = [];

 if(pid.value){
   let oldDoc = await db.collection("products").doc(pid.value).get();

   if(oldDoc.exists){
     let oldData = oldDoc.data();

     if(Array.isArray(oldData.images)){
       oldImages = oldData.images;
     }else if(oldData.image){
       oldImages = [oldData.image];
     }
   }
 }

 let urls = [];

 /* Upload only if new photos are selected */
 if(imageInput && imageInput.files && imageInput.files.length > 0){

   for(const file of imageInput.files){

     let fd = new FormData();
     fd.append("image", file);

     let res = await fetch(
       "https://api.imgbb.com/1/upload?key=" + IMGBB_KEY,
       {
         method:"POST",
         body:fd
       }
     );

     let json = await res.json();

     if(json && json.data && json.data.url){
       urls.push(json.data.url);
     }
   }

 }else{
   // No new photo selected → keep old photos
   urls = oldImages;
 }

 let data={
   category:pcategory.value,
   name:pname.value,
   price:pprice.value,
   mrp:pmrp.value,
   mobile:pmobile.value,
   description:pdesc.value,

   // Keep old images if no new image uploaded
   images:urls,
   image:urls[0] || "",

   hidden:false,
   pinned:false
 };

 if(pid.value){

   await db.collection("products")
     .doc(pid.value)
     .update(data);

 }else{

   data.time = new Date();

   await db.collection("products")
     .add(data);
 }

 // Clear form
 pid.value="";
 pname.value="";
 pprice.value="";
 pmrp.value="";
 pmobile.value="";
 pdesc.value="";
 imageInput.value="";

 alert("Product saved successfully");
}

/* PRODUCTS */

let allProducts = [];

function loadProducts(){

 db.collection("products").onSnapshot(s=>{

  allProducts=[];

  s.forEach(d=>{

   allProducts.push({
    id:d.id,
    ...d.data()
   });

  });

  loadProductCategoryFilter();
  filterProducts();

 });
}


/* CATEGORY FILTER */

function loadProductCategoryFilter(){

 let select=document.getElementById("productCategoryFilter");

 let oldValue=select.value;

 let categories=[];

 allProducts.forEach(p=>{

  if(p.category && !categories.includes(p.category)){
   categories.push(p.category);
  }

 });

 categories.sort();

 select.innerHTML=
 `<option value="ALL">All Categories</option>`;

 categories.forEach(c=>{

  select.innerHTML+=
  `<option value="${c}">${c}</option>`;

 });

 if(categories.includes(oldValue)){
  select.value=oldValue;
 }

}


/* FILTER */

function filterProducts(){

 let selected=
 document.getElementById("productCategoryFilter").value;

 let products;

 if(selected==="ALL"){

  products=allProducts;

 }else{

  products=allProducts.filter(p=>
   p.category===selected
  );

 }

 displayProducts(products);

}


/* DISPLAY */

function displayProducts(products){

 productList.innerHTML="";

 productCount.innerText=
 "Total Products: "+products.length;

 products.forEach(p=>{

  productList.innerHTML+=`

  <div class="product">

   <b>${p.name||""}</b><br>

   <span class="small">
    Category: ${p.category||""}
    | Price: ₹${p.price||""}
    | MRP: ₹${p.mrp||""}
    | ${p.mobile||""}
   </span>

   <div class="actions">

    <button onclick='editProduct("${p.id}",${JSON.stringify(p)})'>
     Edit
    </button>

    <button class="red"
     onclick="delProduct('${p.id}')">
     Delete
    </button>

    <button class="gray"
     onclick="toggleHide('${p.id}',${p.hidden||false})">
     ${p.hidden?"Show":"Hide"}
    </button>

    <button
     onclick="togglePin('${p.id}',${p.pinned||false})">
     ${p.pinned?"Unpin":"Pin"}
    </button>

   </div>

  </div>

  `;

 });

}


/* EDIT */

function editProduct(id,p){

 pid.value=id;
 pname.value=p.name||"";
 pprice.value=p.price||"";
 pmrp.value=p.mrp||"";
 pmobile.value=p.mobile||"";
 pdesc.value=p.description||"";
 pcategory.value=p.category||"";

 window.scrollTo({
  top:0,
  behavior:"smooth"
 });

}


/* DELETE */

function delProduct(id){

 if(confirm("Delete product?")){

  db.collection("products")
   .doc(id)
   .delete();

 }

}


/* HIDE / SHOW */

function toggleHide(id,v){

 db.collection("products")
 .doc(id)
 .update({
  hidden:!v
 });

}


/* PIN / UNPIN */

function togglePin(id,v){

 db.collection("products")
 .doc(id)
 .update({
  pinned:!v
 });

}


/* CATEGORY PDF */

function downloadCategoryPDF(){

 let selected=
 document.getElementById("productCategoryFilter").value;

 let products;

 if(selected==="ALL"){

  products=allProducts;

 }else{

  products=allProducts.filter(p=>
   p.category===selected
  );

 }

 if(products.length===0){

  alert("Is category me koi product nahi hai.");
  return;

 }

 const {jsPDF}=window.jspdf;

 const doc=new jsPDF();

 doc.setFontSize(18);

 doc.text(
  "Shree Balaji Oil Agency",
  14,
  18
 );

 doc.setFontSize(13);

 doc.text(
  selected==="ALL"
   ? "All Products"
   : "Category: "+selected,
  14,
  27
 );

 doc.autoTable({

  startY:35,

  head:[[
   "Product Name",
   "Price",
   "MRP",
   "Category"
  ]],

  body:products.map(p=>[
   p.name||"",
   p.price ? "Rs. "+p.price : "",
   p.mrp ? "Rs. "+p.mrp : "",
   p.category||""
  ]),

  theme:"grid",

  styles:{
   fontSize:10,
   cellPadding:4
  }

 });

 doc.save(
  selected==="ALL"
   ? "All-Products.pdf"
   : selected+"-Products.pdf"
 );

}
</body>
</html>
