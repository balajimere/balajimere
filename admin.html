<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Panel - Shree Balaji Oil Agency</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root{--green:#03A64A;--red:#F21D44}
body{margin:0;font-family:Arial;background:#f4f6f8}
header{background:var(--green);color:#fff;padding:14px;text-align:center;font-size:20px;font-weight:bold}
.container{padding:14px}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:0 2px 6px rgba(0,0,0,.1)}
input,textarea,button,select{width:100%;padding:10px;margin-top:8px;border-radius:6px;border:1px solid #ccc}
button{border:none;background:var(--green);color:#fff;font-size:15px;cursor:pointer}
button.red{background:var(--red)}
button.gray{background:#777}
.product{border-bottom:1px solid #eee;padding:8px 0}
.small{font-size:13px;color:#666}
.scroll{max-height:260px;overflow-y:auto}
.actions button{width:auto;margin-right:6px;margin-top:6px;font-size:13px}
</style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>

<body>

<header>Admin Panel – Shree Balaji Oil Agency</header>

<div class="container">

<div class="card" id="loginBox">
  <h3>Admin Login</h3>
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<div id="dashboard" style="display:none">

  <div class="card">
    <h3>Add Category</h3>
    <input id="catName" placeholder="Category Name">
    <button onclick="addCategory()">Add Category</button>
  </div>

  <div class="card">
    <h3>Add / Edit Product</h3>

    <input type="hidden" id="pid">

    <select id="pcategory"></select>
    <input id="pname" placeholder="Product Name">
    <input id="pprice" placeholder="Price">
    <input id="pmrp" placeholder="MRP">
    <input id="pmobile" placeholder="Mobile Number">
    <textarea id="pdesc" placeholder="Product Description"></textarea>
    <input type="file" id="images" multiple>

    <button onclick="addProduct()">Save Product</button>
  </div>

  <div class="card">

  <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">

    <h3 style="margin:0;">Products</h3>

    <select id="productCategoryFilter"
            onchange="filterProducts()"
            style="width:auto;flex:1;min-width:150px;margin-top:0;">
      <option value="ALL">All Categories</option>
    </select>

    <button onclick="downloadCategoryPDF()"
            style="width:auto;margin-top:0;">
      PDF
    </button>

  </div>

  <div id="productCount"
       class="small"
       style="margin-top:8px;">
    Total Products: 0
  </div>

  <div id="productList" class="scroll"></div>

</div>

  <div class="card">
    <button onclick="location.href='user.html'">View Users</button>
    <button onclick="location.href='admin-order.html'">View Orders</button>
    <button onclick="location.href='status-admin.html'">Status Panel</button>
  </div>

  <button class="red" onclick="logout()">Logout</button>

</div>
</div>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyCt99elKr4T1OJihGpQ6t2luYmCmEBJeo0",
  authDomain: "balajimere-c8eb9.firebaseapp.com",
  projectId: "balajimere-c8eb9"
});

const auth = firebase.auth();
const db = firebase.firestore();
const IMGBB_KEY = "5e77bfe737324a6c147697a13fefcb3d";

/* LOGIN */
function login(){
 auth.signInWithEmailAndPassword(email.value,password.value);
}
function logout(){auth.signOut();}

auth.onAuthStateChanged(u=>{
 if(u && u.email==="balajimere.admin@gmail.com"){
  loginBox.style.display="none";
  dashboard.style.display="block";
  loadProducts();
  loadCategories();
 }else{
  dashboard.style.display="none";
  loginBox.style.display="block";
 }
});

/* CATEGORY */
async function addCategory(){
 let c = catName.value.trim();
 if(!c) return;
 await db.collection("categories").doc(c).set({name:c});
 catName.value="";
}
function loadCategories(){
 db.collection("categories").onSnapshot(s=>{
  pcategory.innerHTML="";
  s.forEach(d=>{
   pcategory.innerHTML+=`<option value="${d.id}">${d.id}</option>`;
  });
 });
}

/* IMAGE UPLOAD + ADD / EDIT PRODUCT */
async function addProduct(){

 let imageInput = document.getElementById("images");

 // Existing images from current product
 let oldImages = [];

 if(pid.value){
   let oldDoc = await db.collection("products").doc(pid.value).get();

   if(oldDoc.exists){
     let oldData = oldDoc.data();

     if(Array.isArray(oldData.images)){
       oldImages = oldData.images;
     }else if(oldData.image){
       oldImages = [oldData.image];
     }
   }
 }

 let urls = [];

 /* Upload only if new photos are selected */
 if(imageInput && imageInput.files && imageInput.files.length > 0){

   for(const file of imageInput.files){

     let fd = new FormData();
     fd.append("image", file);

     let res = await fetch(
       "https://api.imgbb.com/1/upload?key=" + IMGBB_KEY,
       {
         method:"POST",
         body:fd
       }
     );

     let json = await res.json();

     if(json && json.data && json.data.url){
       urls.push(json.data.url);
     }
   }

 }else{
   // No new photo selected → keep old photos
   urls = oldImages;
 }

 let data={
   category:pcategory.value,
   name:pname.value,
   price:pprice.value,
   mrp:pmrp.value,
   mobile:pmobile.value,
   description:pdesc.value,

   // Keep old images if no new image uploaded
   images:urls,
   image:urls[0] || "",

   hidden:false,
   pinned:false
 };

 if(pid.value){

   await db.collection("products")
     .doc(pid.value)
     .update(data);

 }else{

   data.time = new Date();

   await db.collection("products")
     .add(data);
 }

 // Clear form
 pid.value="";
 pname.value="";
 pprice.value="";
 pmrp.value="";
 pmobile.value="";
 pdesc.value="";
 imageInput.value="";

 alert("Product saved successfully");
}

/* PRODUCTS */

let allProducts = [];


/* LOAD PRODUCTS */

function loadProducts(){

  db.collection("products").onSnapshot(function(snapshot){

    allProducts = [];

    snapshot.forEach(function(doc){

      let p = doc.data();

      allProducts.push({
        id: doc.id,
        data: p
      });

    });

    loadProductCategories();

    filterProducts();

  });

}


/* CATEGORY SELECT */

function loadProductCategories(){

  let select =
    document.getElementById("productCategoryFilter");

  if(!select) return;

  let oldValue = select.value;

  select.innerHTML =
    '<option value="ALL">All Categories</option>';

  let categories = [];

  allProducts.forEach(function(item){

    let category = item.data.category;

    if(
      category &&
      !categories.includes(category)
    ){

      categories.push(category);

    }

  });

  categories.sort();

  categories.forEach(function(category){

    let option =
      document.createElement("option");

    option.value = category;
    option.textContent = category;

    select.appendChild(option);

  });

  if(categories.includes(oldValue)){

    select.value = oldValue;

  }else{

    select.value = "ALL";

  }

}


/* FILTER PRODUCTS */

function filterProducts(){

  let select =
    document.getElementById("productCategoryFilter");

  let selected =
    select.value;

  let products = allProducts;


  if(selected !== "ALL"){

    products =
      allProducts.filter(function(item){

        return item.data.category === selected;

      });

  }

  showProducts(products);

}


/* SHOW PRODUCTS */

function showProducts(products){

  let list =
    document.getElementById("productList");

  let count =
    document.getElementById("productCount");

  list.innerHTML = "";

  count.innerText =
    "Total Products: " + products.length;


  products.forEach(function(item){

    let id = item.id;
    let p = item.data;


    let div =
      document.createElement("div");

    div.className = "product";


    let name =
      document.createElement("b");

    name.innerText =
      p.name || "";

    div.appendChild(name);


    div.appendChild(
      document.createElement("br")
    );


    let info =
      document.createElement("span");

    info.className = "small";

    info.innerText =
      (p.category || "") +
      " | ₹" +
      (p.price || "") +
      " | MRP ₹" +
      (p.mrp || "") +
      " | " +
      (p.mobile || "");

    div.appendChild(info);


    let actions =
      document.createElement("div");

    actions.className = "actions";


    /* EDIT */

    let edit =
      document.createElement("button");

    edit.innerText = "Edit";

    edit.onclick = function(){

      editProduct(id, p);

    };

    actions.appendChild(edit);


    /* DELETE */

    let del =
      document.createElement("button");

    del.innerText = "Delete";

    del.className = "red";

    del.onclick = function(){

      delProduct(id);

    };

    actions.appendChild(del);


    /* HIDE */

    let hide =
      document.createElement("button");

    hide.className = "gray";

    hide.innerText =
      p.hidden ? "Show" : "Hide";

    hide.onclick = function(){

      toggleHide(
        id,
        p.hidden || false
      );

    };

    actions.appendChild(hide);


    /* PIN */

    let pin =
      document.createElement("button");

    pin.innerText =
      p.pinned ? "Unpin" : "Pin";

    pin.onclick = function(){

      togglePin(
        id,
        p.pinned || false
      );

    };

    actions.appendChild(pin);


    div.appendChild(actions);

    list.appendChild(div);

  });

}


/* EDIT PRODUCT */

function editProduct(id,p){

  document.getElementById("pid").value =
    id;

  document.getElementById("pname").value =
    p.name || "";

  document.getElementById("pprice").value =
    p.price || "";

  document.getElementById("pmrp").value =
    p.mrp || "";

  document.getElementById("pmobile").value =
    p.mobile || "";

  document.getElementById("pdesc").value =
    p.description || "";

  document.getElementById("pcategory").value =
    p.category || "";

  window.scrollTo(0,0);

}


/* DELETE */

function delProduct(id){

  if(confirm("Delete product?")){

    db.collection("products")
      .doc(id)
      .delete();

  }

}


/* HIDE / SHOW */

function toggleHide(id,v){

  db.collection("products")
    .doc(id)
    .update({
      hidden: !v
    });

}


/* PIN / UNPIN */

function togglePin(id,v){

  db.collection("products")
    .doc(id)
    .update({
      pinned: !v
    });

}


/* =========================
   CATEGORY PDF
========================= */

function downloadCategoryPDF(){

  let select =
    document.getElementById(
      "productCategoryFilter"
    );

  let selected =
    select.value;


  if(selected === "ALL"){

    alert(
      "Pehle category select karein."
    );

    return;

  }


  let products =
    allProducts.filter(function(item){

      return item.data.category === selected;

    });


  if(products.length === 0){

    alert(
      "Is category me koi product nahi hai."
    );

    return;

  }


  const { jsPDF } = window.jspdf;

  let doc =
    new jsPDF();


  /* TITLE */

  doc.setFontSize(18);

  doc.text(
    "Shree Balaji Oil Agency",
    14,
    18
  );


  doc.setFontSize(13);

  doc.text(
    "Category: " + selected,
    14,
    27
  );


  /* PRODUCT TABLE */

  let rows =
    products.map(function(item){

      let p = item.data;

      return [

        p.name || "",

        p.price || "",

        p.mrp || "",

        p.category || ""

      ];

    });


  doc.autoTable({

    startY: 35,

    head: [[
      "Product Name",
      "Price",
      "MRP",
      "Category"
    ]],

    body: rows,

    theme: "grid",

    styles: {
      fontSize: 10,
      cellPadding: 4
    },

    headStyles: {
      fontStyle: "bold"
    }

  });


  /* TOTAL */

  let finalY =
    doc.lastAutoTable.finalY + 10;

  doc.setFontSize(10);

  doc.text(
    "Total Products: " + products.length,
    14,
    finalY
  );


  /* DOWNLOAD */

  let fileName =
    selected
      .replace(/[^a-zA-Z0-9]/g,"-")
      + "-Products.pdf";


  doc.save(fileName);

}

function editProduct(id,p){
 pid.value=id;
 pname.value=p.name||"";
 pprice.value=p.price||"";
 pmrp.value=p.mrp||"";
 pmobile.value=p.mobile||"";
 pdesc.value=p.description||"";
 pcategory.value=p.category||"";
 window.scrollTo(0,0);
}
function delProduct(id){
 if(confirm("Delete product?"))
  db.collection("products").doc(id).delete();
}
function toggleHide(id,v){
 db.collection("products").doc(id).update({hidden:!v});
}
function togglePin(id,v){
 db.collection("products").doc(id).update({pinned:!v});
}
</script>

</body>
                                           </html>
