<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shree Balaji Oil Agency</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root{
 --green:#03A64A
}

*{
 box-sizing:border-box;
}

body{
 margin:0;
 font-family:Arial;
 background:#f7f7f7;
 overflow-x:hidden;
}

/* HEADER */
header{
 background:linear-gradient(90deg,#03A64A,#028a3f);
 color:#fff;
 padding:14px;
 font-size:24px;
 font-weight:bold;
 display:flex;
 align-items:center;
 justify-content:center;
 position:relative;
 letter-spacing:1px;
 font-family:cursive;
}

/* MENU BUTTON */
.menu-btn{
 position:absolute;
 left:12px;
 font-size:22px;
 color:#fff;
 cursor:pointer;
}

/* STATUS BAR */
.status-bar{
 display:flex;
 overflow-x:auto;
 padding:10px;
 background:#fff;
}

.story{
 min-width:70px;
 text-align:center;
 margin-right:10px;
 cursor:pointer;
}

.story img{
 width:60px;
 height:60px;
 border-radius:50%;
 border:3px solid #03A64A;
 object-fit:cover;
}

.story.seen img{
 border-color:#999;
}

.story span{
 font-size:12px;
}

/* TOP TOOLS */
.top-tools{
 display:flex;
 gap:8px;
 padding:10px;
 background:#fff;
 position:sticky;
 top:0;
 z-index:5;
}

.top-tools input,
.top-tools select{
 width:100%;
 padding:8px;
 border:1px solid #ccc;
 border-radius:6px;
}

.category{
 padding:10px;
 font-size:18px;
 font-weight:bold;
 color:#333;
}

/* =========================
   PRODUCT GRID
========================= */

.products{
 display:grid !important;

 /* EXACTLY 2 PRODUCTS PER ROW */
 grid-template-columns:repeat(2,minmax(0,1fr)) !important;

 gap:10px !important;

 width:100% !important;

 padding:8px !important;

 margin:0 0 90px 0 !important;

 box-sizing:border-box !important;
}

/* PRODUCT CARD */

.products .card{
 display:block !important;

 width:100% !important;

 min-width:0 !important;

 max-width:100% !important;

 margin:0 !important;

 background:#fff !important;

 border-radius:10px !important;

 box-shadow:0 3px 10px rgba(0,0,0,.12) !important;

 overflow:hidden !important;

 position:relative !important;
}

/* OFFER BADGE */

.offer-badge{
 position:absolute;
 top:7px;
 left:7px;
 background:red;
 color:#fff;
 font-size:11px;
 padding:4px 7px;
 border-radius:5px;
 z-index:5;
 font-weight:bold;
}

/* PRODUCT IMAGE */

.products .slider{
 width:100%;
 overflow:hidden;
 position:relative;
}

.products .slider-track{
 display:flex;
 width:100%;
 transition:.4s;
}

.products .slider img{
 width:100% !important;
 min-width:100% !important;
 max-width:100% !important;

 height:120px !important;

 object-fit:cover;

 flex-shrink:0;

 cursor:pointer;

 display:block;
}

/* PRODUCT INFO */

.products .info{
 padding:7px;
}

.products .info b{
 display:block;

 font-size:13px;

 line-height:17px;

 height:34px;

 overflow:hidden;
}

/* PRICE */

.price{
 color:var(--green);
 font-weight:bold;
 font-size:14px;
}

.mrp{
 text-decoration:line-through;
 color:#999;
 font-size:11px;
 margin-left:3px;
}

/* BUTTONS */

.products .actions{
 display:flex !important;

 gap:5px;

 margin-top:7px;
}

.products .actions button{
 flex:1 !important;

 width:50% !important;

 border:none;

 border-radius:5px;

 color:#fff;

 font-size:11px;

 padding:7px 2px;

 cursor:pointer;
}

.cart{
 background:#ff9800;
}

.share{
 background:#555;
}

/* BOTTOM NAV */

.bottom-nav{
 position:fixed;
 bottom:0;
 left:0;
 width:100%;
 background:#fff;
 border-top:1px solid #ddd;
 display:flex;
 justify-content:space-around;
 padding:8px 0;
 z-index:10;
}

.bottom-nav i{
 font-size:22px;
 color:var(--green);
}

/* SIDE MENU */

.side-menu{
 position:fixed;
 top:0;
 left:-300px;
 width:250px;
 height:100%;
 background:#fff;
 box-shadow:2px 0 10px rgba(0,0,0,.2);
 transition:.3s;
 z-index:30;
 padding:15px;
}

.side-menu.show{
 left:0;
}

.side-menu a{
 display:block;
 padding:12px;
 border-bottom:1px solid #ddd;
 color:#333;
 text-decoration:none;
 font-weight:bold;
}

.side-menu .close{
 background:red;
 color:#fff;
 text-align:center;
 margin-top:10px;
 border-radius:6px;
}

/* TABLET / DESKTOP */

@media(min-width:700px){

 .products{
   grid-template-columns:repeat(3,minmax(0,1fr)) !important;
 }

}

@media(min-width:1000px){

 .products{
   grid-template-columns:repeat(4,minmax(0,1fr)) !important;
 }

}
</style>
</head>

<body>

<header>
 <div class="menu-btn" onclick="toggleMenu()">☰</div>
 Shree Balaji Oil Agency
</header>

<!-- SIDE MENU -->

<div class="side-menu" id="sideMenu">

 <a href="profile.html">Profile</a>
 <a href="contact.html">Contact</a>
 <a href="career.html">Career</a>
 <a href="franchise.html">Franchise Partner</a>
 <a href="referral.html">Referral</a>
 <a href="about.html">About</a>
 <a href="terms.html">Terms & Conditions</a>
 <a href="privacy.html">Privacy</a>
 <a href="social.html">Social Media</a>

 <a href="home.html" class="close">
  ❌ Close
 </a>

</div>

<!-- STATUS BAR -->

<div class="status-bar" id="statusBar"></div>

<!-- SEARCH -->

<div class="top-tools">

 <input
  type="text"
  id="searchBox"
  placeholder="Search product..."
  oninput="render()"
 >

 <select
  id="catFilter"
  onchange="render()"
 >
  <option value="">All Categories</option>
 </select>

</div>

<!-- PRODUCTS -->

<div id="productList"></div>

<!-- BOTTOM NAV -->

<div class="bottom-nav">

 <i
  class="fa-solid fa-box"
  onclick="location.href='order.html'">
 </i>

 <i
  class="fa-solid fa-user"
  onclick="location.href='login.html'">
 </i>

 <i
  class="fa-solid fa-cart-shopping"
  onclick="location.href='cart.html'">
 </i>

 <i
  class="fa-solid fa-circle-plus"
  onclick="location.href='post.html'">
 </i>

</div>

<script>

firebase.initializeApp({

 apiKey:"AIzaSyCt99elKr4T1OJihGpQ6t2luYmCmEBJeo0",

 authDomain:"balajimere-c8eb9.firebaseapp.com",

 projectId:"balajimere-c8eb9"

});

const db=firebase.firestore();

let ALL=[];


/* MENU */

function toggleMenu(){

 document
 .getElementById("sideMenu")
 .classList
 .toggle("show");

}


/* STATUS LOAD */

db.collection("status")
 .orderBy("time","desc")
 .onSnapshot(s=>{

  statusBar.innerHTML="";

  let seen=
   JSON.parse(
    localStorage.getItem("seenStatus")||"[]"
   );

  s.forEach(d=>{

   let st=d.data();

   let thumb=
    st.images && st.images[0]
     ? st.images[0]
     : "https://via.placeholder.com/60";

   let isSeen=
    seen.includes(d.id);

   statusBar.innerHTML+=`

    <div
     class="story ${isSeen?"seen":""}"
     onclick="openStatus('${d.id}')">

     <img src="${thumb}">

     <span>
      ${st.category || "Status"}
     </span>

    </div>

   `;

  });

 });


function openStatus(id){

 let seen=
  JSON.parse(
   localStorage.getItem("seenStatus")||"[]"
  );

 if(!seen.includes(id)){

  seen.push(id);

  localStorage.setItem(
   "seenStatus",
   JSON.stringify(seen)
  );

 }

 location.href="status.html?id="+id;

}


/* PRODUCTS */

db.collection("products")
 .where("hidden","!=",true)
 .onSnapshot(snap=>{

  ALL=[];

  let cats=new Set();

  snap.forEach(d=>{

   let p=d.data();

   p.id=d.id;

   ALL.push(p);

   cats.add(
    p.category || "Other"
   );

  });

  catFilter.innerHTML=
   '<option value="">All Categories</option>';

  cats.forEach(c=>{

   catFilter.innerHTML+=
    `<option>${c}</option>`;

  });

  render();

 });


/* RENDER PRODUCTS */

function render(){

 let list=
  document.getElementById("productList");

 list.innerHTML="";

 let search=
  document
   .getElementById("searchBox")
   .value
   .toLowerCase();

 let cat=
  document
   .getElementById("catFilter")
   .value;


 let data=ALL.filter(p=>

  (!cat || p.category==cat) &&

  (p.name || "")
   .toLowerCase()
   .includes(search)

 );


 data.sort((a,b)=>
  (b.pinned===true)-
  (a.pinned===true)
 );


 let group={};


 data.forEach(p=>{

  let c=p.category || "Other";

  if(!group[c])
   group[c]=[];

  group[c].push(p);

 });


 Object.keys(group).forEach(cat=>{

  /* CATEGORY */

  list.innerHTML+=`

   <div class="category">
    ${cat}
   </div>

   <div class="products">

  `;


  /* PRODUCTS */

  group[cat].forEach(p=>{

   let imgs=
    p.images?.length
     ? p.images
     : [p.image];


   let slides=
    imgs.map(i=>`

     <img
      src="${i}"
      onclick="view('${p.id}')"
     >

    `).join("");


   list.innerHTML+=`

    <div class="card">

     ${
      p.pinned
       ? '<div class="offer-badge">OFFER</div>'
       : ""
     }

     <div class="slider">

      <div class="slider-track">

       ${slides}

      </div>

     </div>


     <div class="info">

      <b>
       ${p.name || ""}
      </b>


      <span class="price">
       ₹${p.price || ""}
      </span>

      <span class="mrp">
       ₹${p.mrp || ""}
      </span>


      <div class="actions">

       <button
        class="cart"
        onclick='addCart(${JSON.stringify(p)})'
       >
        Buy Now
       </button>


       <button
        class="share"
        onclick="share('${p.name || ""}')"
       >
        Share
       </button>

      </div>

     </div>

    </div>

   `;

  });


  list.innerHTML+=`

   </div>

  `;

 });

}


/* VIEW */

function view(id){

 location.href=
  "view-product.html?id="+id;

}


/* LOGIN */

function isLogin(){

 return localStorage.getItem("user");

}


/* ADD CART */

function addCart(p){

 if(!isLogin())
  return location.href="login.html";


 let q=prompt("Quantity?");

 if(!q || q<=0)
  return;


 let c=
  JSON.parse(
   localStorage.getItem("cart")||"[]"
  );


 c.push({
  ...p,
  qty:q
 });


 localStorage.setItem(
  "cart",
  JSON.stringify(c)
 );


 location.href="cart.html";

}


/* SHARE */

function share(name){

 navigator.share

  ? navigator.share({
     title:name,
     text:name,
     url:location.href
    })

  : window.open(
     `https://wa.me/?text=${name}`
    );

}

</script>

</body>
 </html>
