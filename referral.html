<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Referral</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
body{
 margin:0;
 font-family:Arial;
 background:#f2f2f2;
 display:flex;
 justify-content:center;
 align-items:center;
 height:100vh
}
.box{
 background:#fff;
 padding:25px;
 border-radius:15px;
 box-shadow:0 4px 10px rgba(0,0,0,.2);
 text-align:center;
 width:300px
}
h2{color:#03A64A}
.code{
 font-size:22px;
 font-weight:bold;
 background:#eee;
 padding:10px;
 border-radius:8px;
 margin:15px 0
}
button{
 width:100%;
 padding:12px;
 margin-top:10px;
 border:none;
 border-radius:8px;
 background:#03A64A;
 color:#fff;
 font-size:15px;
 cursor:pointer
}
.download{background:#2196F3}
</style>
</head>

<body>

<div class="box">
 <h2>Refer & Earn</h2>
 <p>Share your referral code with friends</p>

 <div class="code" id="refCode">----</div>
 <div id="inviteCount"></div>
 <div id="pointsCount"></div>

 <button onclick="copyCode()">Copy Referral Code</button>
 <button onclick="shareApp()">Share App</button>
 <button class="download" onclick="downloadApp()">Download App</button>
</div>

<script>
firebase.initializeApp({
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT"
});
const db = firebase.firestore();

/* APK DOWNLOAD LINK */
let apkLink = "https://balajimere.github.io/balajimere/download.apk";

/* GET REF FROM URL */
let urlParams = new URLSearchParams(window.location.search);
let refFromUrl = urlParams.get("ref");

/* USER MOBILE FROM LOGIN */
let user = JSON.parse(localStorage.getItem("user"));

if(user){
 let mobile = user.mobile;

 db.collection("users").doc(mobile).onSnapshot(doc=>{
  let d = doc.data();
  if(!d) return;

  let code = d.referralCode;
  let invites = d.invites || 0;
  let points = d.points || 0;

  document.getElementById("refCode").innerText = code;
  document.getElementById("inviteCount").innerText = "Invites: " + invites;
  document.getElementById("pointsCount").innerText = "Points: " + points;

  window.myCode = code;
 });
}else{
 let tempCode = refFromUrl || "BALAJIAPP";
 document.getElementById("refCode").innerText = tempCode;
 document.getElementById("inviteCount").innerText = "Invites: 0";
 document.getElementById("pointsCount").innerText = "Points: 0";
 window.myCode = tempCode;
}

/* COPY CODE */
function copyCode(){
 navigator.clipboard.writeText(window.myCode);
 alert("Referral code copied: " + window.myCode);
}

/* SHARE APP (AUTO REF LINK) */
function shareApp(){
 let link = apkLink + "?ref=" + window.myCode;

 let text = "Download this app and use my referral code: " + window.myCode +
 "\n\nDownload App: " + link;

 if(navigator.share){
  navigator.share({
   title:"My App",
   text:text,
   url:link
  });
 }else{
  window.open("https://wa.me/?text="+encodeURIComponent(text));
 }
}

/* DOWNLOAD APP */
function downloadApp(){
 let link = apkLink + "?ref=" + window.myCode;
 window.location.href = link;
}
</script>

</body>
</html>
