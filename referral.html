<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Referral</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
 margin:0;
 font-family:Arial;
 background:#f2f2f2;
 display:flex;
 justify-content:center;
 align-items:center;
 height:100vh
}
.box{
 background:#fff;
 padding:25px;
 border-radius:15px;
 box-shadow:0 4px 10px rgba(0,0,0,.2);
 text-align:center;
 width:300px
}
h2{color:#03A64A}
.code{
 font-size:22px;
 font-weight:bold;
 background:#eee;
 padding:10px;
 border-radius:8px;
 margin:15px 0
}
button{
 width:100%;
 padding:12px;
 margin-top:10px;
 border:none;
 border-radius:8px;
 background:#03A64A;
 color:#fff;
 font-size:15px;
 cursor:pointer
}
.download{background:#2196F3}
</style>
</head>

<body>

<div class="box">
 <h2>Refer & Earn</h2>
 <p>Share your referral code with friends</p>

 <div class="code" id="refCode">----</div>

 <button onclick="copyCode()">Copy Referral Code</button>
 <button onclick="shareApp()">Share App</button>
 <button class="download" onclick="downloadApp()">Download App</button>
</div>

<script>
let urlParams = new URLSearchParams(window.location.search);
let code = urlParams.get("code");

if(!code){
 code = "BALAJI123"; // default referral code
}

document.getElementById("refCode").innerText = code;

function copyCode(){
 navigator.clipboard.writeText(code);
 alert("Referral code copied: " + code);
}

function shareApp(){
 let text = "Download this app and use my referral code: " + code +
 "\n\nDownload here: https://yourappsite.com/download.html?ref=" + code;

 if(navigator.share){
  navigator.share({
   title: "My App",
   text: text,
   url: "https://yourappsite.com/download.html?ref=" + code
  });
 }else{
  window.open("https://wa.me/?text=" + encodeURIComponent(text));
 }
}

function downloadApp(){
 window.location.href = "https://yourappsite.com/app.apk";
}
</script>

</body>
</html>
